# BusyRealtor Apache Virtual Host Configuration
# Place this file in /etc/apache2/sites-available/busyrealtor.conf
# Then enable with: sudo a2ensite busyrealtor.conf
# Reload Apache: sudo systemctl reload apache2

# HTTP Virtual Host (Port 80)
<VirtualHost *:80>
    ServerName busyrealtor.com
    ServerAlias www.busyrealtor.com
    
    # Document Root
    DocumentRoot /var/www/busyrealtor.com/public
    
    # Directory Configuration
    <Directory /var/www/busyrealtor.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security Headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>
    
    # Error and Access Logs
    ErrorLog ${APACHE_LOG_DIR}/busyrealtor_error.log
    CustomLog ${APACHE_LOG_DIR}/busyrealtor_access.log combined
    
    # Log Level (adjust as needed)
    LogLevel warn
    
    # PHP Configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    
    # Redirect all HTTP to canonical HTTPS www
    RewriteEngine On
    RewriteRule ^(.*)$ https://www.busyrealtor.com%{REQUEST_URI} [L,R=301]
</VirtualHost>

# SSL Virtual Host (Port 443)
# Uncomment this entire section after running certbot
# Certbot command: sudo certbot --apache -d busyrealtor.com -d www.busyrealtor.com

<VirtualHost *:443>
    ServerName busyrealtor.com
    ServerAlias www.busyrealtor.com

    # Redirect non-www to www (canonical)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteRule ^(.*)$ https://www.%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    # Document Root
    DocumentRoot /var/www/busyrealtor.com/public
    
    # Directory Configuration
    <Directory /var/www/busyrealtor.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security Headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net js.stripe.com maps.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; frame-src js.stripe.com; connect-src 'self' api.stripe.com;"
    </Directory>
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/busyrealtor.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/busyrealtor.com/privkey.pem
#    
#    # SSL Protocol Configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
#    
#    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
#    
#    # Error and Access Logs
    ErrorLog ${APACHE_LOG_DIR}/busyrealtor_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/busyrealtor_ssl_access.log combined
#    
#    # Log Level
    LogLevel warn
#    
#    # PHP Configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

# Additional Security Configuration
# Add these to your main Apache config or .htaccess

# Prevent access to sensitive files
<FilesMatch "\.(env|sql|sh|log|md|git)$">
    Require all denied
</FilesMatch>

# Prevent directory browsing
Options -Indexes

# Protect includes directory
<Directory /var/www/busyrealtor.com/includes>
    Require all denied
</Directory>

# Protect vendor directory
<Directory /var/www/busyrealtor.com/vendor>
    Require all denied
</Directory>

# Protect config file
<FilesMatch "^config\.php$">
    Require all denied
</FilesMatch>

