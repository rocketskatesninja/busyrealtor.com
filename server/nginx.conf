# =============================================================================
# BusyRealtor.com — Nginx Server Block Configuration
# =============================================================================
# Prerequisites:
#   sudo apt install nginx php8.3-fpm
#   sudo systemctl enable --now php8.3-fpm
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/busyrealtor.conf
#   sudo ln -s /etc/nginx/sites-available/busyrealtor.conf \
#              /etc/nginx/sites-enabled/busyrealtor.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo apt install python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Replace ALL occurrences of:
#   yourdomain.com        → your actual domain
#   /var/www/busyrealtor  → your actual app path
#   php8.3-fpm.sock       → your FPM socket (check: ls /run/php/)
# =============================================================================

# ── HTTP: redirect to HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge (needed for certbot http-01)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root  /var/www/busyrealtor/public;
    index index.php;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern SSL config (Mozilla Intermediate, Jan 2025)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout        5s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                    always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                always;

    # Content Security Policy — tighten as needed
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://maps.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; frame-src 'self' https://www.google.com; connect-src 'self' https:;" always;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/busyrealtor_access.log;
    error_log  /var/log/nginx/busyrealtor_error.log warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-font-ttf font/woff font/woff2
        image/svg+xml;

    # ── File upload size ──────────────────────────────────────────────────────
    client_max_body_size 64M;

    # ── Laravel front controller ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files       $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass    unix:/run/php/php8.3-fpm.sock;
        fastcgi_index   index.php;
        fastcgi_param   SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include         fastcgi_params;

        fastcgi_read_timeout    120;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;

        # Pass real IP from proxy/CDN
        fastcgi_param   HTTP_X_REAL_IP      $remote_addr;
        fastcgi_param   HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # ── Static assets: long-lived cache ───────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires        1y;
        add_header     Cache-Control "public, immutable";
        access_log     off;
        log_not_found  off;
    }

    # ── Block access to sensitive files and directories ───────────────────────
    location ~ /\.(env|git|sql|sh|log|htaccess) {
        deny all;
        return 404;
    }

    location ^~ /vendor/ {
        deny all;
        return 404;
    }

    location ^~ /storage/logs/ {
        deny all;
        return 404;
    }

    # ── Stripe webhook: disable CSRF (Laravel Cashier handles verification) ───
    # The webhook route is /stripe/webhook — no special config needed;
    # Laravel's routes/web.php excludes it from CSRF middleware automatically.
}
