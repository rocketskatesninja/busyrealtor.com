# =============================================================================
# BusyRealtor.com — Apache Virtual Host Configuration
# =============================================================================
# Prerequisites:
#   sudo a2enmod rewrite headers ssl deflate expires
#
# Install:
#   sudo cp apache.conf /etc/apache2/sites-available/busyrealtor.conf
#   sudo a2ensite busyrealtor.conf
#   sudo systemctl reload apache2
#
# SSL (Let's Encrypt):
#   sudo apt install python3-certbot-apache
#   sudo certbot --apache -d yourdomain.com -d www.yourdomain.com
#
# Replace ALL occurrences of:
#   yourdomain.com        → your actual domain
#   /var/www/busyrealtor  → your actual app path
#   php8.3                → your installed PHP version (if using FPM)
# =============================================================================

# ── HTTP: redirect all traffic to HTTPS ──────────────────────────────────────
<VirtualHost *:80>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog  ${APACHE_LOG_DIR}/busyrealtor_error.log
    CustomLog ${APACHE_LOG_DIR}/busyrealtor_access.log combined
</VirtualHost>

# ── HTTPS ─────────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com

    DocumentRoot /var/www/busyrealtor/public

    # ── Directory ─────────────────────────────────────────────────────────────
    <Directory /var/www/busyrealtor/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Security headers
        Header always set X-Content-Type-Options    "nosniff"
        Header always set X-Frame-Options           "SAMEORIGIN"
        Header always set X-XSS-Protection          "1; mode=block"
        Header always set Referrer-Policy           "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

        # Content Security Policy — tighten as needed
        Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://maps.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; frame-src 'self' https://www.google.com; connect-src 'self' https:;"
    </Directory>

    # ── PHP: mod_php (simple, single-user server) ─────────────────────────────
    # Comment this block out and use the FPM block below for production servers
    # with multiple sites or PHP version control.
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    # ── PHP: PHP-FPM (recommended for production) ─────────────────────────────
    # Uncomment to use FPM instead of mod_php. Also run:
    #   sudo a2enmod proxy_fcgi setenvif
    #   sudo a2enconf php8.3-fpm
    #
    # <FilesMatch "\.php$">
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    # ── Static asset caching ──────────────────────────────────────────────────
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg             "access plus 1 year"
        ExpiresByType image/jpeg            "access plus 1 year"
        ExpiresByType image/gif             "access plus 1 year"
        ExpiresByType image/png             "access plus 1 year"
        ExpiresByType image/webp            "access plus 1 year"
        ExpiresByType image/svg+xml        "access plus 1 year"
        ExpiresByType text/css              "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/x-font-woff "access plus 1 year"
        ExpiresByType font/woff2            "access plus 1 year"
    </IfModule>

    # ── Compression ───────────────────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml application/x-font-woff
    </IfModule>

    # ── SSL ───────────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # Modern SSL configuration (disables TLS 1.0 / 1.1)
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # OCSP Stapling
    SSLUseStapling        on
    SSLStaplingCache      "shmcb:${APACHE_RUN_DIR}/ssl_stapling(32768)"

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/busyrealtor_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/busyrealtor_ssl_access.log combined
    LogLevel  warn
</VirtualHost>

# ── Security: deny access to sensitive files globally ─────────────────────────
<FilesMatch "\.(env|sql|sh|log|md|lock|git)$">
    Require all denied
</FilesMatch>

<Directory /var/www/busyrealtor/vendor>
    Require all denied
</Directory>

<Directory /var/www/busyrealtor/storage>
    Require all denied
</Directory>
